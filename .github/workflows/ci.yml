name: CI Test & Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Build & Automated Tests
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Automated Test Suite (212 Assertions)
        shell: cmd
        run: |
          call run_tests.bat

      - name: Compile Standalone Executable
        shell: cmd
        run: |
          call compile.bat
